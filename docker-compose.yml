services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    depends_on:
      - postgres
      - redis

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: incident
      POSTGRES_DB: incident_response
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/storage/postgres_pgvector.sql:/docker-entrypoint-initdb.d/001_pgvector.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  langfuse:
    image: langfuse/langfuse:2
    profiles: ["tracing"]
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://incident:incident@postgres:5432/incident_response
      NEXTAUTH_SECRET: local-langfuse-secret
      SALT: local-langfuse-salt
      NEXTAUTH_URL: http://localhost:3001
      TELEMETRY_ENABLED: "false"
    depends_on:
      - postgres

volumes:
  pgdata:
  ollama:
