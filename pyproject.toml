[project]
name = "ai-security-alert-investigation-agent"
version = "0.1.0"
description = "AI incident response agent for SOC alert triage, evidence collection, threat enrichment, and remediation guidance."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "prometheus-client>=0.20.0",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
  "langgraph>=1.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0",
]
postgres = [
  "psycopg[binary]>=3.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]
